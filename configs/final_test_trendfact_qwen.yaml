  split: test
  candidate_top_k: 20
  labels_visible: false

output:
  path: outputs/final/trendfact_one_shot_v1/qwen/test_top5.jsonl
  manifest_path: outputs/final/trendfact_one_shot_v1/qwen/manifest.json
